<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Engineering DAG: CU</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🎓</text></svg>'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Graph libraries are vendored locally (see /lib) so the page never
         depends on a CDN. Versions: cytoscape 3.28.1, dagre 0.8.5, cytoscape-dagre 2.5.0 -->
    <script src="lib/cytoscape.min.js"></script>
    <script src="lib/dagre.min.js"></script>
    <script src="lib/cytoscape-dagre.js"></script>
    <!-- Single source of truth: all course data lives in curriculum.js -->
    <script src="curriculum.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(145deg, #0a0a14 0%, #12122a 35%, #0f1b2d 70%, #0a1628 100%);
            color: #e2e8f0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 12px 18px 8px;
            gap: 8px;
        }

        /* ── Header ── */
        .header { text-align: center; flex-shrink: 0; position: relative; }

        /* ── View switcher (cross-link to the other page) ── */
        .view-switch {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(96,165,250,0.08);
            border: 1px solid rgba(96,165,250,0.18);
            border-radius: 8px;
            color: #93c5fd;
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .view-switch:hover {
            background: rgba(96,165,250,0.16);
            border-color: rgba(96,165,250,0.35);
            color: #dbeafe;
        }

        .view-switch .vs-icon { font-size: 0.9rem; line-height: 1; }
        .view-switch.home { right: auto; left: 0; }

        @media (max-width: 640px) {
            .view-switch .vs-text { display: none; }
            .view-switch { padding: 6px 9px; }
        }

        .header h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 45%, #2dd4bf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 0.72rem;
            color: #475569;
            margin-top: 2px;
        }

        /* ── Legend ── */
        .legend-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            padding: 7px 16px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            flex-shrink: 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.68rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 3px;
        }

        /* ── Tabs ── */
        .tab-bar {
            display: flex;
            gap: 3px;
            padding: 3px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            padding: 7px 10px;
            border: none;
            background: transparent;
            color: #4b5563;
            font-family: 'Inter', sans-serif;
            font-size: 0.76rem;
            font-weight: 500;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .tab:hover { background: rgba(255,255,255,0.035); color: #94a3b8; }

        .tab.active {
            background: rgba(255,255,255,0.07);
            color: #f1f5f9;
            font-weight: 600;
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
        }

        /* ── Main ── */
        .main-content {
            flex: 1;
            display: flex;
            gap: 10px;
            min-height: 0;
            position: relative;
        }

        .graph-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .graph-subtitle {
            font-size: 0.72rem;
            color: #3f4f63;
            text-align: center;
            flex-shrink: 0;
            margin-bottom: 5px;
            font-style: italic;
        }

        .cy-wrapper {
            flex: 1;
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(255,255,255,0.012);
            border: 1px solid rgba(255,255,255,0.04);
        }

        #cy { width: 100%; height: 100%; position: relative; z-index: 2; }

        .load-error {
            position: absolute; inset: 0; z-index: 3;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; gap: 8px; padding: 24px; color: #94a3b8;
        }
        .load-error .le-emoji { font-size: 2rem; opacity: 0.8; }
        .load-error b { color: #e2e8f0; font-size: 1rem; }
        .load-error p { font-size: 0.82rem; max-width: 42ch; }
        .load-error a { color: #60a5fa; font-size: 0.85rem; text-decoration: none; }
        .load-error a:hover { text-decoration: underline; }

        /* Rings sit BELOW the cytoscape layer so edges/arrows draw on top of them */
        #cy-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .reset-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border-radius: 7px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(10,10,20,0.75);
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s;
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .reset-btn:hover {
            background: rgba(20,20,40,0.9);
            color: #e2e8f0;
            border-color: rgba(255,255,255,0.15);
        }

        /* ── Info Panel ── */
        .info-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 290px;
            height: 100%;
            z-index: 20;
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .info-panel.visible {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }

        .info-inner {
            width: 290px;
            height: 100%;
            padding: 18px;
            background: #13132a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            box-shadow: -4px 0 24px rgba(0,0,0,0.5);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-inner::-webkit-scrollbar { width: 3px; }
        .info-inner::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

        .info-header { position: relative; }

        .info-close {
            position: absolute;
            top: 0;
            right: 0;
            width: 26px;
            height: 26px;
            border: none;
            background: rgba(255,255,255,0.04);
            color: #64748b;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .info-close:hover { background: rgba(255,255,255,0.08); color: #fff; }

        .info-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .info-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-top: 3px;
        }

        .info-badges {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .badge {
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
        }

        .badge.outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.12);
            color: #94a3b8;
        }

        .info-desc {
            font-size: 0.76rem;
            color: #7c8a9a;
            line-height: 1.55;
        }

        .info-section h3 {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #4b5563;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .dep-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 5px;
            margin-bottom: 3px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dep-item:hover { background: rgba(255,255,255,0.05); }

        .dep-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .dep-name { font-size: 0.68rem; color: #64748b; }

        .dep-type {
            margin-left: auto;
            font-size: 0.55rem;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .dep-type.prereq { background: rgba(167,139,250,0.15); color: #a78bfa; }
        .dep-type.recommended { background: rgba(96,165,250,0.12); color: #60a5fa; }
        .dep-type.coreq { background: rgba(148,163,184,0.1); color: #94a3b8; }

        .cugetreg-link {
            display: block;
            margin-top: 2px;
            padding: 7px 14px;
            background: rgba(96,165,250,0.08);
            border: 1px solid rgba(96,165,250,0.15);
            border-radius: 7px;
            color: #60a5fa;
            font-size: 0.75rem;
            font-weight: 500;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s;
        }

        .cugetreg-link:hover {
            background: rgba(96,165,250,0.15);
            border-color: rgba(96,165,250,0.3);
        }

        .cugetreg-link.disabled {
            background: rgba(148,163,184,0.05);
            border: 1px dashed rgba(148,163,184,0.25);
            color: #64748b;
            cursor: not-allowed;
        }
        .cugetreg-link.disabled:hover {
            background: rgba(148,163,184,0.05);
            border-color: rgba(148,163,184,0.25);
        }

        /* ── Edge Legend ── */
        .edge-legend {
            display: flex;
            gap: 24px;
            justify-content: center;
            padding: 6px;
            flex-shrink: 0;
        }

        .edge-legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.67rem;
            color: #4b5563;
        }

        .el-line {
            width: 24px;
            height: 0;
            border-top: 2.5px solid rgba(255,255,255,0.4);
        }

        .el-line.dashed { border-top-style: dashed; border-color: rgba(255,255,255,0.2); }
        .el-line.dotted { border-top-style: dotted; border-color: rgba(148,163,184,0.35); }

        .el-arrow {
            width: 0;
            height: 0;
            border-left: 5px solid rgba(255,255,255,0.4);
            border-top: 3px solid transparent;
            border-bottom: 3px solid transparent;
        }

        .el-arrow.dashed { border-left-color: rgba(255,255,255,0.2); }
        .el-arrow.dotted { border-left-color: rgba(148,163,184,0.35); }

        /* ── Semester Filters ── */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            padding: 6px 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            flex-shrink: 0;
        }

        .filter-label {
            font-size: 0.7rem;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-right: 2px;
            flex-shrink: 0;
        }

        .filter-quick {
            display: flex;
            gap: 3px;
        }

        .filter-quick-btn {
            padding: 3px 8px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            color: #94a3b8;
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-quick-btn:hover {
            background: rgba(255,255,255,0.08);
            color: #f1f5f9;
        }

        .filter-divider {
            width: 1px;
            height: 16px;
            background: rgba(255,255,255,0.08);
            margin: 0 4px;
        }

        .filter-group {
            display: flex;
            gap: 3px;
            align-items: center;
            background: rgba(255,255,255,0.015);
            padding: 2px 4px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .filter-year-btn {
            padding: 3px 7px;
            border: none;
            background: transparent;
            color: #a78bfa;
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-year-btn:hover {
            background: rgba(167,139,250,0.15);
            color: #c4b5fd;
        }

        .filter-btn {
            padding: 3px 8px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.02);
            color: #475569;
            font-family: 'Inter', sans-serif;
            font-size: 0.66rem;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filter-btn:hover {
            background: rgba(255,255,255,0.05);
            color: #cbd5e1;
        }

        .filter-btn.active {
            background: rgba(96,165,250,0.14);
            border-color: rgba(96,165,250,0.3);
            color: #60a5fa;
            font-weight: 600;
        }

        /* ── Standalone Note ── */
        .standalone-note {
            font-size: 0.65rem;
            color: #374151;
            text-align: center;
            padding: 4px;
            flex-shrink: 0;
        }

        .standalone-note span { color: #64748b; font-weight: 500; }

        /* ── Progress summary bar ── */
        .progress-summary {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 6px 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            flex-shrink: 0;
        }
        .ps-bar {
            flex: 1;
            min-width: 110px;
            height: 7px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .ps-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #34d399, #2dd4bf, #60a5fa);
            border-radius: 4px;
            transition: width 0.35s ease;
        }
        .ps-text { font-size: 0.72rem; color: #94a3b8; white-space: nowrap; }
        .ps-text b { color: #e2e8f0; }
        .ps-tools { display: flex; gap: 5px; }
        .ps-tools button, #ps-import-label {
            padding: 4px 9px;
            font-size: 0.66rem;
            font-weight: 600;
            color: #94a3b8;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .ps-tools button:hover, #ps-import-label:hover {
            background: rgba(255,255,255,0.08);
            color: #f1f5f9;
        }
        .state-legend { display: flex; gap: 10px; }
        .state-legend .sl {
            font-size: 0.63rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .state-legend .sl::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 3px;
            border: 2px solid;
        }
        .state-legend .sl.done::before { border-color: #34d399; }
        .state-legend .sl.progress::before { border-color: #fbbf24; }
        .state-legend .sl.ready::before { border-color: #22d3ee; border-style: dashed; }

        /* ── Learning checklist (info panel) ── */
        .checklist-head { display: flex; gap: 12px; align-items: center; }
        .checklist-head .ring { flex-shrink: 0; }
        .cl-count { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
        .cl-actions { display: flex; gap: 5px; margin-top: 6px; }
        .cl-actions button {
            padding: 3px 8px;
            font-size: 0.6rem;
            font-weight: 600;
            color: #94a3b8;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .cl-actions button:hover { background: rgba(255,255,255,0.08); color: #f1f5f9; }
        .topic-list { display: flex; flex-direction: column; gap: 3px; }
        .topic-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .topic-row:hover { background: rgba(255,255,255,0.05); }
        .topic-check {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1.5px solid rgba(255,255,255,0.25);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .topic-row.checked .topic-check { background: #34d399; border-color: #34d399; }
        .topic-row.checked .topic-check::after {
            content: '✓';
            color: #0a0a14;
            font-size: 0.7rem;
            font-weight: 800;
        }
        .topic-text { font-size: 0.74rem; color: #cbd5e1; }
        .topic-row.checked .topic-text { color: #6b7280; text-decoration: line-through; }
        .verify-flag {
            font-size: 0.62rem;
            color: #fbbf24;
            background: rgba(251,191,36,0.1);
            border: 1px solid rgba(251,191,36,0.2);
            border-radius: 5px;
            padding: 4px 7px;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Computer Engineering Roadmap</h1>
            <p class="subtitle" id="subtitle"></p>
            <a class="view-switch home" href="index.html" title="Back to home">
                <span class="vs-icon">⌂</span><span class="vs-text">Home</span>
            </a>
            <a class="view-switch" href="semester_courses.html" title="Switch to the semester grid view">
                <span class="vs-icon">▦</span><span class="vs-text">Semester Grid</span>
            </a>
        </header>

        <div class="legend-bar" id="legend-bar"></div>

        <div class="progress-summary">
            <div class="ps-bar"><div class="ps-fill" id="ps-fill"></div></div>
            <div class="ps-text" id="ps-text"></div>
            <div class="state-legend">
                <span class="sl done">Done</span>
                <span class="sl progress">In progress</span>
                <span class="sl ready">Ready</span>
            </div>
            <div class="ps-tools">
                <button id="ps-export" title="Download your progress as a file">⬇ Export</button>
                <label id="ps-import-label" title="Load progress from a file">⬆ Import<input type="file" id="ps-import" accept="application/json" hidden></label>
                <button id="ps-reset" title="Clear all progress">↺ Reset</button>
            </div>
        </div>

        <nav class="tab-bar" id="tab-bar"></nav>

        <div class="filter-bar" id="filter-bar">
            <span class="filter-label">Filter Semesters:</span>
            <div class="filter-quick">
                <button class="filter-quick-btn" id="filter-all" title="Select all semesters">All</button>
                <button class="filter-quick-btn" id="filter-none" title="Deselect all semesters">Clear</button>
            </div>
            <div class="filter-divider"></div>
            <div class="filter-group">
                <button class="filter-year-btn" data-year="1" title="Toggle entire Year 1">Year 1</button>
                <button class="filter-btn active" data-year="1" data-sem="1" title="Year 1 Semester 1">Y1 S1</button>
                <button class="filter-btn active" data-year="1" data-sem="2" title="Year 1 Semester 2">Y1 S2</button>
            </div>
            <div class="filter-group">
                <button class="filter-year-btn" data-year="2" title="Toggle entire Year 2">Year 2</button>
                <button class="filter-btn active" data-year="2" data-sem="1" title="Year 2 Semester 1">Y2 S1</button>
                <button class="filter-btn active" data-year="2" data-sem="2" title="Year 2 Semester 2">Y2 S2</button>
            </div>
            <div class="filter-group">
                <button class="filter-year-btn" data-year="3" title="Toggle entire Year 3">Year 3</button>
                <button class="filter-btn active" data-year="3" data-sem="1" title="Year 3 Semester 1">Y3 S1</button>
                <button class="filter-btn active" data-year="3" data-sem="2" title="Year 3 Semester 2">Y3 S2</button>
            </div>
            <div class="filter-group">
                <button class="filter-year-btn" data-year="4" title="Toggle entire Year 4">Year 4</button>
                <button class="filter-btn active" data-year="4" data-sem="1" title="Year 4 Semester 1">Y4 S1</button>
                <button class="filter-btn active" data-year="4" data-sem="2" title="Year 4 Semester 2">Y4 S2</button>
            </div>
        </div>

        <div class="main-content">
            <div class="graph-area">
                <div class="graph-subtitle" id="graph-subtitle"></div>
                <div class="cy-wrapper">
                    <div id="cy"></div>
                    <canvas id="cy-overlay"></canvas>
                    <button class="reset-btn" onclick="resetView()" title="Fit graph to viewport">⊡</button>
                </div>
            </div>
            <div class="info-panel" id="info-panel">
                <div class="info-inner" id="info-inner">
                    <div style="text-align:center;padding:50px 10px;color:#374151">
                        <div style="font-size:1.8rem;margin-bottom:10px;opacity:0.5">🔍</div>
                        <div style="font-size:0.8rem">Click any course node<br>to view details</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="edge-legend">
            <div class="edge-legend-item"><div class="el-line"></div><div class="el-arrow"></div><span>Required Prerequisite</span></div>
            <div class="edge-legend-item"><div class="el-line dashed"></div><div class="el-arrow dashed"></div><span>Recommended Flow</span></div>
            <div class="edge-legend-item"><div class="el-line dotted"></div><div class="el-arrow dotted"></div><span>Corequisite (Taken Together)</span></div>
        </div>

        <div class="standalone-note">
            <span>Not shown:</span> <span id="omitted-note"></span>
        </div>
    </div>

    <script>
    // ═══════════════════════════════════════════════════════
    //  DATA — all sourced from curriculum.js (window.CURRICULUM)
    // ═══════════════════════════════════════════════════════
    const DATA = window.CURRICULUM;

    // Fast lookup: course key -> course object (with topics attached)
    const courseByKey = {};
    DATA.courses.forEach(c => {
        c.topics = DATA.courseTopics[c.key] || [];
        courseByKey[c.key] = c;
    });
    const verifySet = new Set(DATA.topicsToVerify || []);
    const noGetReg = new Set(DATA.getRegUnavailable || []);

    // ═══════════════════════════════════════════════════════
    //  PROGRESS STORAGE  (localStorage, per-browser)
    //   Shape: { [courseKey]: { [topicText]: true } }
    // ═══════════════════════════════════════════════════════
    const LS_KEY = 'cpRoadmap.progress.v1';
    let progress = loadProgress();

    function loadProgress() {
        try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
        catch (e) { return {}; }
    }
    function saveProgress() {
        try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) {}
    }
    function isLearned(key, tp) { return !!(progress[key] && progress[key][tp]); }
    function setLearned(key, tp, val) {
        if (val) { (progress[key] = progress[key] || {})[tp] = true; }
        else if (progress[key]) {
            delete progress[key][tp];
            if (!Object.keys(progress[key]).length) delete progress[key];
        }
        saveProgress();
    }

    // ── Progress math ──
    function courseFraction(key) {
        const t = courseByKey[key].topics || [];
        if (!t.length) return 0;
        return t.filter(tp => isLearned(key, tp)).length / t.length;
    }
    function courseLearned(key) {
        const t = courseByKey[key].topics || [];
        return t.filter(tp => isLearned(key, tp)).length;
    }
    function courseDone(key) {
        const t = courseByKey[key].topics || [];
        return t.length > 0 && t.every(tp => isLearned(key, tp));
    }
    // A course is "ready" once every hard prerequisite is done (no prereqs => ready)
    function prereqsSatisfied(key) {
        return DATA.edges
            .filter(e => e.to === key && e.type === 'prereq')
            .every(e => courseDone(e.from));
    }
    function computeState(key) {
        const f = courseFraction(key);
        if (f >= 1) return 'done';
        if (f > 0) return 'progress';
        return prereqsSatisfied(key) ? 'ready' : 'idle';
    }
    function dagCourseKeys() { return DATA.courses.filter(c => c.dag).map(c => c.key); }

    // ═══════════════════════════════════════════════════════
    //  COLORS & LABELS  (view-specific hex; names come from data)
    // ═══════════════════════════════════════════════════════
    const categoryColors = {
        'purple': '#a78bfa', 'teal': '#2dd4bf', 'blue': '#60a5fa',
        'pink': '#f472b6', 'red': '#fb7185', 'olive': '#bef264',
    };
    const categoryBorders = {
        'purple': '#8b5cf6', 'teal': '#14b8a6', 'blue': '#3b82f6',
        'pink': '#ec4899', 'red': '#f43f5e', 'olive': '#a3e635',
    };
    const categoryLabels = DATA.dagCategories;

    // ═══════════════════════════════════════════════════════
    //  TRACK DEFINITIONS  (built from data)
    // ═══════════════════════════════════════════════════════
    const tracks = {
        complete: {
            label: DATA.completeTrack.label,
            subtitle: DATA.completeTrack.subtitle,
            keys: DATA.courses.filter(c => c.dag).map(c => c.key),
            rankSep: DATA.completeTrack.rankSep,
            nodeSep: DATA.completeTrack.nodeSep,
        },
    };
    Object.entries(DATA.tracks).forEach(([id, t]) => {
        tracks[id] = {
            label: t.label, subtitle: t.subtitle,
            keys: t.keys.filter(k => courseByKey[k]),
            rankSep: t.rankSep, nodeSep: t.nodeSep,
        };
    });
    const trackOrder = ['complete', ...Object.keys(DATA.tracks)];

    // ═══════════════════════════════════════════════════════
    //  CYTOSCAPE STYLE
    // ═══════════════════════════════════════════════════════
    const cyStyle = [
        {
            selector: 'node',
            style: {
                'label': 'data(label)',
                'text-wrap': 'wrap',
                'text-valign': 'center',
                'text-halign': 'center',
                'font-family': '"Inter", sans-serif',
                'font-size': '10.5px',
                'font-weight': '600',
                'color': '#fff',
                'text-outline-width': 0,
                'shape': 'roundrectangle',
                'width': 'label',
                'height': 'label',
                'padding': '12px',
                'text-max-width': '120px',
                'border-width': 2,
                'background-color': 'data(catcolor)',
                'background-opacity': 0.92,
                'transition-property': 'opacity, border-width, border-color',
                'transition-duration': '0.2s',
            }
        },
        // Category border color (course identity)
        ...Object.entries(categoryBorders).map(([cat, color]) => ({
            selector: `node[category = "${cat}"]`,
            style: { 'border-color': color }
        })),
        // "Ready to take" = prerequisites complete, not yet started (progress ring is 0)
        { selector: 'node.state-ready', style: { 'border-color': '#22d3ee', 'border-width': 2.5, 'border-style': 'dashed' } },
        // Base edge style
        {
            selector: 'edge',
            style: {
                'curve-style': 'bezier',
                'target-arrow-shape': 'triangle',
                'target-arrow-color': 'rgba(255,255,255,0.45)',
                'line-color': 'rgba(255,255,255,0.35)',
                'width': 2,
                'arrow-scale': 1.1,
                'transition-property': 'opacity, line-color, width',
                'transition-duration': '0.2s',
            }
        },
        { selector: 'edge[type = "prereq"]',      style: { 'line-style': 'solid',  'line-color': 'rgba(255,255,255,0.45)', 'target-arrow-color': 'rgba(255,255,255,0.45)', 'width': 2.5 } },
        { selector: 'edge[type = "recommended"]', style: { 'line-style': 'dashed', 'line-color': 'rgba(255,255,255,0.18)', 'target-arrow-color': 'rgba(255,255,255,0.18)', 'width': 1.5 } },
        {
            selector: 'edge[type = "coreq"]',
            style: {
                'line-style': 'dotted',
                'line-color': 'rgba(148,163,184,0.3)',
                'target-arrow-shape': 'diamond',
                'target-arrow-color': 'rgba(148,163,184,0.3)',
                'source-arrow-shape': 'diamond',
                'source-arrow-color': 'rgba(148,163,184,0.3)',
                'width': 1.5,
            }
        },
        // Semester filter dimming
        { selector: 'node.filter-dimmed', style: { 'opacity': 0.14 } },
        { selector: 'edge.filter-dimmed', style: { 'opacity': 0.06 } },
        // Hover highlighting
        { selector: '.dimmed', style: { 'opacity': 0.08 } },
        { selector: '.highlighted', style: { 'border-width': 4, 'border-color': '#fbbf24', 'z-index': 999, 'opacity': 1 } },
        { selector: '.connected', style: { 'opacity': 1 } },
        {
            selector: '.connected-edge',
            style: {
                'opacity': 1, 'width': 3,
                'line-color': 'rgba(251,191,36,0.65)',
                'target-arrow-color': 'rgba(251,191,36,0.65)',
                'source-arrow-color': 'rgba(251,191,36,0.65)',
            }
        },
    ];

    // ═══════════════════════════════════════════════════════
    //  GRAPH STATE
    // ═══════════════════════════════════════════════════════
    let cy = null;
    let currentTrack = 'complete';
    let selectedNode = null;
    const activeFilters = new Set(['1-1','1-2','2-1','2-2','3-1','3-2','4-1','4-2']);

    // ═══════════════════════════════════════════════════════
    //  BUILD ELEMENTS FOR A TRACK
    // ═══════════════════════════════════════════════════════
    function getElements(trackId) {
        const track = tracks[trackId];
        const keySet = new Set(track.keys);

        const nodes = track.keys.filter(k => courseByKey[k]).map(k => {
            const c = courseByKey[k];
            return {
                data: { id: k, label: `${c.code}\n${c.abbr}`, category: c.color, catcolor: categoryColors[c.color] || '#94a3b8' },
                classes: 'state-' + computeState(k),
            };
        });

        const edges = DATA.edges
            .filter(e => keySet.has(e.from) && keySet.has(e.to))
            .map(e => ({ data: { id: `${e.from}__${e.to}`, source: e.from, target: e.to, type: e.type } }));

        return [...nodes, ...edges];
    }

    // ═══════════════════════════════════════════════════════
    //  SEMESTER FILTERS (opacity, no layout jump)
    // ═══════════════════════════════════════════════════════
    function applySemesterFilters() {
        if (!cy) return;
        cy.batch(() => {
            cy.nodes().forEach(node => {
                const c = courseByKey[node.id()];
                if (!c) return;
                node[activeFilters.has(`${c.year}-${c.sem}`) ? 'removeClass' : 'addClass']('filter-dimmed');
            });
            cy.edges().forEach(edge => {
                const dim = edge.source().hasClass('filter-dimmed') || edge.target().hasClass('filter-dimmed');
                edge[dim ? 'addClass' : 'removeClass']('filter-dimmed');
            });
        });

        const totalNodes = cy.nodes().length;
        const activeNodes = cy.nodes().not('.filter-dimmed').length;
        const track = tracks[currentTrack];
        const sub = document.getElementById('graph-subtitle');
        if (activeNodes === 0) sub.textContent = 'All courses dimmed (no matching semester selected)';
        else if (activeNodes < totalNodes) sub.textContent = `Highlighting ${activeNodes} of ${totalNodes} courses`;
        else sub.textContent = track.subtitle;
    }

    // ═══════════════════════════════════════════════════════
    //  UPDATE NODE VISUALS (state border) + progress rings
    // ═══════════════════════════════════════════════════════
    function updateNodeVisuals() {
        if (!cy) return;
        cy.batch(() => {
            cy.nodes().forEach(n => {
                const k = n.id();
                n.removeClass('state-done state-progress state-ready state-idle');
                n.addClass('state-' + computeState(k));
            });
        });
        drawRings();
    }

    // ═══════════════════════════════════════════════════════
    //  PROGRESS RINGS  —  a canvas overlay that traces each node's
    //  rounded-rectangle outline proportional to its completion.
    // ═══════════════════════════════════════════════════════
    const overlay = document.getElementById('cy-overlay');
    const octx = overlay.getContext('2d');
    let drawScheduled = false;

    function scheduleDraw() {
        if (drawScheduled) return;
        drawScheduled = true;
        requestAnimationFrame(() => { drawScheduled = false; drawRings(); });
    }
    function sizeOverlay() {
        const wrap = overlay.parentElement;
        const dpr = window.devicePixelRatio || 1;
        const w = wrap.clientWidth, h = wrap.clientHeight;
        overlay.width = Math.round(w * dpr);
        overlay.height = Math.round(h * dpr);
        overlay.style.width = w + 'px';
        overlay.style.height = h + 'px';
    }
    // Build a rounded-rect path that STARTS at top-center and runs clockwise,
    // so a dashed stroke reveals progress starting from the top. Returns perimeter.
    function roundRectTopStart(ctx, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        const cx = x + w / 2;
        ctx.beginPath();
        ctx.moveTo(cx, y);
        ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
        ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
        ctx.lineTo(cx, y);
        return 2 * (w - 2 * r) + 2 * (h - 2 * r) + 2 * Math.PI * r;
    }
    // Cytoscape's built-in round-rectangle radius = min(w/4, h/4, 8) in MODEL units.
    const NODE_CORNER_CAP = 8;
    function drawRings() {
        if (!cy || !octx) return;
        const dpr = window.devicePixelRatio || 1;
        octx.setTransform(dpr, 0, 0, dpr, 0, 0);
        octx.clearRect(0, 0, overlay.width / dpr, overlay.height / dpr);
        octx.lineCap = 'round';
        const zoom = cy.zoom();
        const m = 4;                                   // gap between node border and ring
        cy.nodes().forEach(n => {
            const k = n.id();
            const bb = n.renderedBoundingBox({ includeLabels: false, includeOverlays: false });
            const bw = bb.x2 - bb.x1, bh = bb.y2 - bb.y1;
            const x = bb.x1 - m, y = bb.y1 - m, w = bw + 2 * m, h = bh + 2 * m;
            if (w <= 2 || h <= 2) return;
            // Match the node's own rendered corner radius, then offset outward by m
            // so the ring runs exactly parallel to the node's rounded corners.
            const nodeR = Math.min(bw / 4, bh / 4, NODE_CORNER_CAP * zoom);
            const r = Math.min(nodeR + m, w / 2, h / 2);
            const dim = n.hasClass('dimmed') || n.hasClass('filter-dimmed');
            const a = dim ? 0.10 : 1;
            const frac = courseFraction(k);
            const done = frac >= 1;

            // faint background track (the full loop)
            const P = roundRectTopStart(octx, x, y, w, h, r);
            octx.setLineDash([]);
            octx.lineWidth = 3;
            octx.strokeStyle = `rgba(255,255,255,${0.06 * a})`;
            octx.stroke();

            // green progress arc (semi-transparent)
            if (frac > 0) {
                roundRectTopStart(octx, x, y, w, h, r);
                octx.lineWidth = 3.5;
                octx.strokeStyle = `rgba(52,211,153,${(done ? 0.78 : 0.68) * a})`;
                if (done) octx.setLineDash([]);
                else { octx.setLineDash([P * frac, P]); octx.lineDashOffset = 0; }
                octx.stroke();
                octx.setLineDash([]);
            }
        });
    }
    window.addEventListener('resize', () => { sizeOverlay(); scheduleDraw(); });

    // ═══════════════════════════════════════════════════════
    //  RENDER GRAPH
    // ═══════════════════════════════════════════════════════
    function showLoadError() {
        const el = document.getElementById('cy');
        if (el) el.innerHTML = '<div class="load-error"><div class="le-emoji">🛰️</div>' +
            '<b>Couldn\'t load the interactive graph</b>' +
            '<p>The graph library didn\'t load. Refreshing the page usually fixes it. The Semester Grid view still works.</p>' +
            '<a href="semester_courses.html">Open the Semester Grid →</a></div>';
        const sub = document.getElementById('graph-subtitle');
        if (sub) sub.textContent = '';
    }

    function renderGraph(trackId) {
        // Graceful failure if the vendored graph libraries didn't load
        if (typeof window.cytoscape === 'undefined' || typeof window.dagre === 'undefined') {
            showLoadError();
            return;
        }
        if (cy) cy.destroy();
        const track = tracks[trackId];
        const elements = getElements(trackId);

        try {
            cy = cytoscape({
                container: document.getElementById('cy'),
                elements, style: cyStyle,
                userZoomingEnabled: true, userPanningEnabled: true,
                boxSelectionEnabled: false, autoungrabify: true,
                minZoom: 0.25, maxZoom: 3.5, wheelSensitivity: 0.15,
            });

            if (elements.length > 0) {
                cy.layout({ name: 'dagre', rankDir: 'TB', rankSep: track.rankSep, nodeSep: track.nodeSep, padding: 40, animate: false, fit: true }).run();
            }
        } catch (err) {
            // e.g. the dagre layout extension failed to register
            showLoadError();
            return;
        }

        // Keep the progress-ring overlay in sync with pan / zoom / resize
        sizeOverlay();
        cy.on('render', scheduleDraw);
        cy.on('resize', () => { sizeOverlay(); scheduleDraw(); });

        applySemesterFilters();
        updateNodeVisuals();
        refreshProgressUI();

        // Debounced hover highlighting
        let hoverTimeout = null, isHoverActive = false;
        function clearHoverHighlight() {
            if (hoverTimeout) { clearTimeout(hoverTimeout); hoverTimeout = null; }
            if (isHoverActive) { cy.elements().removeClass('dimmed highlighted connected connected-edge'); isHoverActive = false; }
        }
        cy.on('mouseover', 'node', e => {
            const node = e.target;
            if (hoverTimeout) clearTimeout(hoverTimeout);
            hoverTimeout = setTimeout(() => {
                if (!cy) return;
                const hood = node.closedNeighborhood();
                cy.elements().addClass('dimmed');
                hood.removeClass('dimmed');
                node.addClass('highlighted');
                hood.edges().addClass('connected-edge');
                hood.nodes().not(node).addClass('connected');
                isHoverActive = true; hoverTimeout = null;
            }, 250);
        });
        cy.on('mouseout', 'node', clearHoverHighlight);
        cy.on('pan zoom', clearHoverHighlight);

        cy.on('tap', 'node', e => {
            const nodeId = e.target.id();
            if (selectedNode === nodeId) hideInfoPanel(); else showInfoPanel(nodeId);
        });
        cy.on('tap', e => { if (e.target === cy) hideInfoPanel(); });
    }

    // ═══════════════════════════════════════════════════════
    //  INFO PANEL  (+ learning checklist + progress ring)
    // ═══════════════════════════════════════════════════════
    function ringSVG(frac) {
        const pct = Math.round(frac * 100), r = 26, C = 2 * Math.PI * r, off = C * (1 - frac);
        const col = frac >= 1 ? '#34d399' : (frac > 0 ? '#fbbf24' : '#475569');
        return `<svg class="ring" width="64" height="64" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
            <circle id="ring-fg" cx="32" cy="32" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round"
                stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 32 32)"/>
            <text id="ring-label" x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">${pct}%</text>
        </svg>`;
    }
    function updateRing(frac) {
        const r = 26, C = 2 * Math.PI * r;
        const fg = document.getElementById('ring-fg'), lb = document.getElementById('ring-label');
        if (fg) {
            fg.setAttribute('stroke-dashoffset', (C * (1 - frac)).toFixed(1));
            fg.setAttribute('stroke', frac >= 1 ? '#34d399' : (frac > 0 ? '#fbbf24' : '#475569'));
        }
        if (lb) lb.textContent = Math.round(frac * 100) + '%';
    }

    function showInfoPanel(courseKey) {
        const course = courseByKey[courseKey];
        if (!course) return;
        selectedNode = courseKey;

        const color = categoryColors[course.color] || '#94a3b8';
        const trackKeys = new Set(tracks[currentTrack].keys);
        const prereqs = DATA.edges.filter(e => e.to === courseKey && trackKeys.has(e.from) && courseByKey[e.from]).map(e => ({ key: e.from, ...courseByKey[e.from], edgeType: e.type }));
        const dependents = DATA.edges.filter(e => e.from === courseKey && trackKeys.has(e.to) && courseByKey[e.to]).map(e => ({ key: e.to, ...courseByKey[e.to], edgeType: e.type }));
        const isCodeValid = /^\d+$/.test(course.code);
        const getRegOff = noGetReg.has(courseKey);
        const topics = course.topics || [];
        const frac = courseFraction(courseKey), total = topics.length, learned = courseLearned(courseKey);

        document.getElementById('info-inner').innerHTML = `
            <div class="info-header">
                <button class="info-close" onclick="hideInfoPanel()">×</button>
                <div class="info-code" style="color:${color}">${course.code}</div>
                <div class="info-name">${course.name}</div>
                <div class="info-badges">
                    <span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}33">${course.credits} credit${course.credits > 1 ? 's' : ''}</span>
                    <span class="badge outline">Year ${course.year} · Sem ${course.sem}</span>
                </div>
            </div>
            ${course.desc ? `<div class="info-desc">${course.desc}</div>` : ''}
            ${total ? `
                <div class="info-section">
                    <div class="checklist-head">
                        ${ringSVG(frac)}
                        <div>
                            <h3>Learning Checklist</h3>
                            <div class="cl-count" id="cl-count">${learned}/${total} topics learned</div>
                            <div class="cl-actions">
                                <button onclick="setAllTopics('${courseKey}', true)">Mark all</button>
                                <button onclick="setAllTopics('${courseKey}', false)">Clear</button>
                            </div>
                        </div>
                    </div>
                    ${verifySet.has(courseKey) ? `<div class="verify-flag">⚠ Topics seeded from a standard syllabus — verify against the official outline.</div>` : ''}
                    <div class="topic-list" style="margin-top:8px">
                        ${topics.map((tp, i) => `
                            <div class="topic-row ${isLearned(courseKey, tp) ? 'checked' : ''}" data-i="${i}" onclick="toggleTopic('${courseKey}', ${i})">
                                <span class="topic-check"></span><span class="topic-text">${tp}</span>
                            </div>`).join('')}
                    </div>
                </div>` : ''}
            ${prereqs.length ? `
                <div class="info-section">
                    <h3>Prerequisites</h3>
                    ${prereqs.map(p => `
                        <div class="dep-item" onclick="focusNode('${p.key}')">
                            <span class="dep-code">${p.code}</span>
                            <span class="dep-name">${p.abbr}</span>
                            <span class="dep-type ${p.edgeType}">${p.edgeType}</span>
                        </div>`).join('')}
                </div>` : ''}
            ${dependents.length ? `
                <div class="info-section">
                    <h3>Leads To</h3>
                    ${dependents.map(d => `
                        <div class="dep-item" onclick="focusNode('${d.key}')">
                            <span class="dep-code">${d.code}</span>
                            <span class="dep-name">${d.abbr}</span>
                            <span class="dep-type ${d.edgeType}">${d.edgeType}</span>
                        </div>`).join('')}
                </div>` : ''}
            ${isCodeValid && !getRegOff ? `
                <a class="cugetreg-link" href="${DATA.meta.getRegBase}${course.code}" target="_blank" rel="noopener noreferrer">View on CU Get Reg ↗</a>` : ''}
            ${isCodeValid && getRegOff ? `
                <div class="cugetreg-link disabled" title="This course has no CU Get Reg page yet">CU Get Reg — not available</div>` : ''}
        `;
        document.getElementById('info-panel').classList.add('visible');
    }

    function hideInfoPanel() {
        selectedNode = null;
        document.getElementById('info-panel').classList.remove('visible');
    }
    function focusNode(nodeKey) {
        const node = cy.$('#' + nodeKey);
        if (node.length) { cy.animate({ center: { eles: node }, zoom: cy.zoom() }, { duration: 350 }); showInfoPanel(nodeKey); }
    }
    function resetView() { cy?.fit(50); }

    // ── Checklist interactions ──
    function toggleTopic(key, i) {
        const tp = courseByKey[key].topics[i];
        const cur = isLearned(key, tp);
        setLearned(key, tp, !cur);
        const row = document.querySelector(`.topic-row[data-i="${i}"]`);
        if (row) row.classList.toggle('checked', !cur);
        const frac = courseFraction(key), total = courseByKey[key].topics.length, learned = courseLearned(key);
        updateRing(frac);
        const cc = document.getElementById('cl-count');
        if (cc) cc.textContent = `${learned}/${total} topics learned`;
        updateNodeVisuals();
        refreshProgressUI();
    }
    function setAllTopics(key, val) {
        (courseByKey[key].topics || []).forEach(tp => setLearned(key, tp, val));
        showInfoPanel(key);
        updateNodeVisuals();
        refreshProgressUI();
    }

    // ═══════════════════════════════════════════════════════
    //  HEADER PROGRESS SUMMARY
    // ═══════════════════════════════════════════════════════
    function refreshProgressUI() {
        const all = dagCourseKeys();
        let learned = 0, total = 0, doneCount = 0;
        all.forEach(k => {
            const t = courseByKey[k].topics || [];
            total += t.length; learned += t.filter(tp => isLearned(k, tp)).length;
            if (courseDone(k)) doneCount++;
        });
        const pct = total ? Math.round(learned / total * 100) : 0;

        const tkeys = tracks[currentTrack].keys.filter(k => courseByKey[k] && courseByKey[k].dag);
        let tl = 0, tt = 0;
        tkeys.forEach(k => { const t = courseByKey[k].topics || []; tt += t.length; tl += t.filter(tp => isLearned(k, tp)).length; });
        const tpct = tt ? Math.round(tl / tt * 100) : 0;

        document.getElementById('ps-fill').style.width = pct + '%';
        const viewLabel = currentTrack === 'complete' ? 'this view' : tracks[currentTrack].label.replace(/^\S+\s/, '');
        document.getElementById('ps-text').innerHTML =
            `<b>${pct}%</b> overall · ${doneCount}/${all.length} courses complete · ${viewLabel} <b>${tpct}%</b>`;
    }

    // ═══════════════════════════════════════════════════════
    //  TAB SWITCHING
    // ═══════════════════════════════════════════════════════
    function switchTab(trackId) {
        if (trackId === currentTrack) return;
        currentTrack = trackId;
        hideInfoPanel();
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.track === trackId));
        setTimeout(() => renderGraph(trackId), 50);
    }
    const tabBar = document.getElementById('tab-bar');
    trackOrder.forEach((id, i) => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (i === 0 ? ' active' : '');
        btn.dataset.track = id;
        btn.textContent = tracks[id].label;
        btn.addEventListener('click', () => switchTab(id));
        tabBar.appendChild(btn);
    });

    // ═══════════════════════════════════════════════════════
    //  SEMESTER FILTERING
    // ═══════════════════════════════════════════════════════
    const semButtons = document.querySelectorAll('.filter-btn[data-year]');
    function updateActiveFilterUI() {
        semButtons.forEach(btn => btn.classList.toggle('active', activeFilters.has(`${btn.dataset.year}-${btn.dataset.sem}`)));
    }
    semButtons.forEach(btn => btn.addEventListener('click', () => {
        const key = `${btn.dataset.year}-${btn.dataset.sem}`;
        activeFilters.has(key) ? activeFilters.delete(key) : activeFilters.add(key);
        updateActiveFilterUI(); applySemesterFilters();
    }));
    document.querySelectorAll('.filter-year-btn').forEach(yBtn => yBtn.addEventListener('click', () => {
        const y = yBtn.dataset.year, k1 = `${y}-1`, k2 = `${y}-2`;
        const both = activeFilters.has(k1) && activeFilters.has(k2);
        if (both) { activeFilters.delete(k1); activeFilters.delete(k2); } else { activeFilters.add(k1); activeFilters.add(k2); }
        updateActiveFilterUI(); applySemesterFilters();
    }));
    document.getElementById('filter-all')?.addEventListener('click', () => {
        ['1-1','1-2','2-1','2-2','3-1','3-2','4-1','4-2'].forEach(k => activeFilters.add(k));
        updateActiveFilterUI(); applySemesterFilters();
    });
    document.getElementById('filter-none')?.addEventListener('click', () => {
        activeFilters.clear(); updateActiveFilterUI(); applySemesterFilters();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hideInfoPanel(); });

    // ═══════════════════════════════════════════════════════
    //  EXPORT / IMPORT / RESET
    // ═══════════════════════════════════════════════════════
    document.getElementById('ps-export').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(progress, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'cp-roadmap-progress.json';
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(a.href);
    });
    document.getElementById('ps-import').addEventListener('change', e => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
            try {
                const data = JSON.parse(rd.result);
                if (data && typeof data === 'object') {
                    progress = data; saveProgress();
                    updateNodeVisuals(); refreshProgressUI();
                    if (selectedNode) showInfoPanel(selectedNode);
                }
            } catch (err) { alert('Could not read that progress file.'); }
            e.target.value = '';
        };
        rd.readAsText(f);
    });
    document.getElementById('ps-reset').addEventListener('click', () => {
        if (confirm('Clear all learning progress? This cannot be undone.')) {
            progress = {}; saveProgress();
            updateNodeVisuals(); refreshProgressUI();
            if (selectedNode) showInfoPanel(selectedNode);
        }
    });

    // ═══════════════════════════════════════════════════════
    //  HEADER / LEGEND / FOOTER  (from data)
    // ═══════════════════════════════════════════════════════
    document.getElementById('subtitle').textContent =
        `${DATA.meta.university} · ${DATA.meta.program} · Curriculum ${DATA.meta.curriculumYear}`;
    document.getElementById('omitted-note').textContent = DATA.dagOmittedNote;

    const legendBar = document.getElementById('legend-bar');
    Object.entries(categoryLabels).forEach(([cat, label]) => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.innerHTML = `<div class="legend-dot" style="background:${categoryColors[cat]}"></div><span>${label}</span>`;
        legendBar.appendChild(item);
    });

    // ═══════════════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════════════
    renderGraph('complete');
    </script>
</body>
</html>
